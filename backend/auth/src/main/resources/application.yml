spring:
  application:
    name: auth
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  profiles:
    default: local

server:
  port: ${AUTH_PORT:8081}

auth:
  jwt:
    # Текущий ключ подписи (PEM). Секреты только из окружения.
    kid: ${AUTH_JWT_KID}
    private-key: ${AUTH_JWT_PRIVATE_KEY}
    public-key: ${AUTH_JWT_PUBLIC_KEY}
    # Предыдущий ключ для ротации (опционально): публикуется в JWKS и принимается при валидации
    previous-kid: ${AUTH_JWT_PREVIOUS_KID:}
    previous-public-key: ${AUTH_JWT_PREVIOUS_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:shatrev-auth}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  cookie:
    refresh-token-max-age-seconds: 604800
  google:
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${AUTH_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${AUTH_GOOGLE_REDIRECT_URI:}
    token-endpoint: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com
