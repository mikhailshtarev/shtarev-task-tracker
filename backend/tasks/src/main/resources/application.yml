spring:
  application:
    name: tasks
  datasource:
    url: ${TASKS_DB_URL}
    username: ${TASKS_DB_USER}
    password: ${TASKS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  address: ${TASKS_BIND_ADDRESS:127.0.0.1}
  port: ${TASKS_PORT:8082}

tasks:
  internal:
    hmac-key: ${TASKS_INTERNAL_HMAC_KEY}
