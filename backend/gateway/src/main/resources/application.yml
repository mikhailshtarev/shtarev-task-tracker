server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS обрабатывается здесь; от ответов downstream убираем дубли CORS-заголовков
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: tasks
              uri: ${TASKS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**
            - id: branches
              uri: ${TASKS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/branches,/api/v1/branches/**

gateway:
  internal:
    tasks-hmac-key: ${TASKS_INTERNAL_HMAC_KEY}
  # /api/v1/auth/** полностью публичен на гейтвее — правила доступа применяет сервис auth
  public-paths:
    - /api/v1/auth/**
  jwt:
    jwks-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/api/v1/auth/.well-known/jwks.json
    issuer: ${AUTH_JWT_ISSUER:shatrev-auth}
